<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polidex Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a reference tool. One narrow column, sticky tab bar, cards that read like index entries. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#0B1F44; --muted:#56627A; --line:#D9DFEA;
  --accent:#B22234; --accent-soft:#FBE9EC; --on-accent:#FFFFFF; --blue:#0A3161; --blue-soft:#E6EDF7; --on-blue:#FFFFFF;
  --flag:#B45309; --flag-soft:#FDF1DD; --ok:#0F766E;
  --font-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1428; --surface:#111E38; --ink:#EEF2FA; --muted:#9FAAC2; --line:#26365A;
    --accent:#FF6B7D; --accent-soft:#3A1620; --on-accent:#1A0A0E; --blue:#9DBBFF; --blue-soft:#18294A; --on-blue:#0A1428;
    --flag:#F2B45C; --flag-soft:#3A2A10; --ok:#4FD1C5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1428; --surface:#111E38; --ink:#EEF2FA; --muted:#9FAAC2; --line:#26365A;
  --accent:#FF6B7D; --accent-soft:#3A1620; --on-accent:#1A0A0E; --blue:#9DBBFF; --blue-soft:#18294A; --on-blue:#0A1428;
  --flag:#F2B45C; --flag-soft:#3A2A10; --ok:#4FD1C5; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
.stripe{height:5px;background:linear-gradient(90deg,var(--accent) 0 33.33%,var(--surface) 33.33% 66.66%,var(--blue) 66.66%)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 64px}
header.top{display:flex;align-items:baseline;gap:10px;padding:20px 0 10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:-0.02em}
.brand span{color:var(--accent)}
.proto{font-family:var(--font-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;padding:8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 12px;border-radius:6px}
nav.tabs a[aria-current="page"]{background:var(--blue);color:var(--on-blue)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
h1{font-size:26px;line-height:1.15;font-weight:800}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.view{padding-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:11px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.pill.flag{background:var(--flag-soft);border-color:transparent;color:var(--flag)}
.pill.fic{border-style:dashed}
/* compass */
.compass{width:100%;max-width:420px;display:block;margin:0 auto}
.compass text{font-family:var(--font-body);fill:var(--muted);font-size:10.5px}
.compass .dot text{fill:var(--on-blue);font-weight:600;font-size:9.5px}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
input[type=search]{flex:1 1 160px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.compass g[data-open]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend b{font-family:var(--font-mono);font-weight:500;background:var(--blue);color:var(--on-blue);border-radius:999px;padding:1px 6px;font-size:11px;margin-right:5px}
.legend .you b{background:var(--accent);color:var(--on-accent)}
/* foreign bar */
.fbar{position:relative;height:10px;border-radius:5px;background:var(--line);margin:18px 0 6px}
.fbar i{position:absolute;top:-5px;width:20px;height:20px;border-radius:50%;margin-left:-10px;background:var(--blue);border:2px solid var(--surface)}
.fbar i.you{background:var(--accent)}
.fbar::after{content:"";position:absolute;left:50%;top:-4px;height:18px;width:1px;background:var(--muted)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
/* profile list */
.plist{display:grid;gap:10px}
.pitem{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-family:var(--font-mono);font-size:13px}
.pitem .name{font-weight:600}
.match{font-family:var(--font-display);font-weight:800;font-size:20px;text-align:right}
/* quiz */
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.qtext{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.25;text-wrap:balance}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:center;justify-items:center;margin-top:6px}
.scale button{border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0;aspect-ratio:1}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.s3{width:44px}.s2{width:38px}.s1{width:32px}.s0{width:26px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;font-size:14px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
/* evidence */
.ev{border-top:1px solid var(--line);padding:12px 0}
.ev:first-of-type{border-top:0}
.readings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.reading{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.reading .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.vote{font-size:13px;margin-top:8px;padding-left:10px;border-left:3px solid var(--line)}
.hist{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--blue-soft)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{border-left:3px solid var(--flag);background:var(--flag-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
@media (prefers-reduced-motion:no-preference){.progress i{transition:width .2s}}
.live{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:8px 0 0}
.live .dotl{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.live>span:nth-child(2){flex:1 1 200px;min-width:0}
.live.on .dotl{background:var(--ok)}
.live button{font-size:13px;padding:4px 10px}
.live details{flex-basis:100%;font-size:12px;word-break:break-all}
.usmap{width:100%;max-width:440px;display:block;margin:0 auto}
.tile{cursor:pointer}
.tile rect{fill:var(--blue-soft);stroke:var(--line)}
.tile text{font-size:9px;font-family:var(--font-mono);fill:var(--ink);pointer-events:none}
.tile.on rect{fill:var(--blue)}
.tile.on text{fill:var(--on-blue)}
.tile:focus-visible rect{stroke:var(--accent);stroke-width:2}
button.terr[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
</style>
</head>

const ST = RAW.map(a => ({id:a[0], cat:a[1], text:a[2], dir:a[3], quick:!!a[4], axis:a[0][0]}));
const BYID = Object.fromEntries(ST.map(s => [s.id, s]));
const SCALE = ['Strongly disagree','Disagree','Somewhat disagree','Indifferent','Somewhat agree','Agree','Strongly agree'];
const scaleLabel = v => SCALE[Math.round(v) + 3];

/* ---------- Scoring (pure functions) ---------- */
function sign(st){ return (st.dir === 'R' || st.dir === 'G') ? 1 : (st.dir === 'T' ? 0 : -1); }
/* readings: {statementId: agree value from -3 to 3}. Returns each axis scaled to -10..10 plus count. */
function axisScores(readings){
  const out = {E:{sum:0,n:0}, S:{sum:0,n:0}, F:{sum:0,n:0}};
  for (const id in readings){
    const st = BYID[id]; const v = readings[id];
    if (!st || st.axis === 'T' || typeof v !== 'number') continue;
    out[st.axis].sum += v * sign(st); out[st.axis].n++;
  }
  for (const k in out){ const o = out[k]; o.v = o.n ? (o.sum / o.n) * 100 / 3 : null; }
  return out;
}
function band(v){
  if (v === null) return 'Not enough data';
  if (v <= -70) return 'Far left'; if (v <= -40) return 'Left'; if (v < -15) return 'Center-left';
  if (v <= 15) return 'Center'; if (v < 40) return 'Center-right'; if (v < 70) return 'Right'; return 'Far right';
}
function fband(v){
  if (v === null) return 'Not enough data';
  if (v <= -60) return 'Strong restraint'; if (v <= -20) return 'Leans restraint';
  if (v < 20) return 'Mixed'; if (v < 60) return 'Leans engagement'; return 'Strong engagement';
}
const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
/* Per statement: said, voted, combined (votes count double), and the said vs voted flag. */
function profileReadings(p){
  const per = {};
  for (const e of p.evidence){
    const o = per[e.s] || (per[e.s] = {said:[], voted:[], items:[]});
    o.items.push(e);
    if (e.a === null) continue; /* shown but not scored */
    (e.k === 'vote' ? o.voted : o.said).push(e.a);
  }
  const combined = {};
  for (const id in per){
    const o = per[id];
    o.saidV = o.said.length ? avg(o.said) : null;
    o.votedV = o.voted.length ? avg(o.voted) : null;
    o.combined = o.saidV === null ? o.votedV : o.votedV === null ? o.saidV : (2 * o.votedV + o.saidV) / 3;
    o.flag = o.saidV !== null && o.votedV !== null && Math.abs(o.saidV - o.votedV) >= 3;
    if (o.combined !== null) combined[id] = o.combined;
  }
  return {per, combined};
}
/* Match: similarity on shared statements, weighted by the user's importance rating. */
function matchScore(ans, imp, combined){
  let w = 0, s = 0, n = 0;
  for (const id in combined){
    const u = ans[id]; if (typeof u !== 'number') continue;
    const wt = imp[id] || 2; s += wt * (1 - Math.abs(u - combined[id]) / 6); w += wt; n++;
  }
  return {n, pct: n >= 3 ? Math.round(100 * s / w) : null};
}

  for (const k of ['snap', 'payload', 'structuredContent', 'result', 'text', 'content', 'rows', 'data']) if (k in x){ const r = findSnap(x[k], depth + 1); if (r) return r; }

      countVote(rc.id, m[2], c);
      for (const mp of rc.map){ if (!BYID[mp[0]]) continue; ev.push({s:mp[0], k:'vote', a:mex[rc.id] ? null : (c === 'Y' ? mp[1] : -mp[1]), bill:rc.bill, title:rc.title, date:rc.date, tally:rc.tally, cast:c === 'Y' ? 'Yea' : 'Nay', note:mex[rc.id] || mp[2] || '', src:rc.src}); }
    });
    (m[7] || []).forEach(i => { if (defs[i] && BYID[defs[i].s]) ev.push(defs[i]); });
    return mkProfile(m[0], m[1], m[2], m[3], m[4], m[5], ev);
  });
  PROFILES.length = 0; out.forEach(p => PROFILES.push(p)); finishProfiles();
  ROLLS = rolls.H.concat(rolls.S);
  LIVE = {at:snap.at || 'just now', rolls:snap.rolls.length, members:out.length};
  if (state.sel && !PROFILES.some(p => p.id === state.sel)) state.sel = null;
}
function dropLive(){ if (LIVE){ LIVE = null; loadEmbedded(); state.sel = null; if (typeof document !== 'undefined') render(); } }
function liveError(e, raw){
  const c = e && e.code, where = ' in claude.ai Settings, Connectors, then tap Try again.';
  if (c === 'needs_reauth'){ dropLive(); return setLive(BUILTIN + ' Your Supabase connection has expired. Reconnect Supabase' + where, false, 'Try again'); }
  if (c === 'server_not_connected' || c === 'server_not_found' || c === 'selection_required'){ dropLive(); return setLive(BUILTIN + ' Live data needs the Supabase connector. Add or choose Supabase' + where, false, 'Try again'); }
  if (c === 'approval_required' || c === 'consent_required'){ dropLive(); return setLive(BUILTIN + ' Live data needs your approval. Tap the button and choose Allow.', false, 'Load live data'); }
  if (c === 'not_in_manifest' || c === 'blocked_by_policy'){ dropLive(); return setLive(BUILTIN + ' Live data is not allowed for this view.', false); }
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed' || c === 'user_changed') return setLive(BUILTIN + ' Live data is not available in this view.', false);
  if (c === 'tool_error') return setLive((LIVE ? 'Still showing data from ' + esc(LIVE.at) + '.' : BUILTIN) + ' The database reported an error: ' + esc(String(e.message || '').slice(0, 160)), !!LIVE, 'Try again');
  if (c === 'parse') return setLive(BUILTIN + ' Live data arrived in a form this page could not read.' + (raw ? '<details><summary>Details to send back</summary>' + esc(raw) + '</details>' : ''), false, 'Try again');
  return setLive((LIVE ? 'Still showing data from ' + esc(LIVE.at) + '.' : BUILTIN) + ' The database did not answer' + (c ? ' (' + esc(c) + ')' : '') + '. Try again in a moment.', !!LIVE, 'Try again');
}
async function loadLive(fresh){
  if (liveBusy) return; liveBusy = true;
  let raw = '';
  try {
    setLive((LIVE ? 'Refreshing' : BUILTIN + ' Checking the Polidex database') + '...', !!LIVE);
    if (!MCP) MCP = (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function') ? await window.claude.use('mcp') : null;
    if (!MCP){
      try {
        const r = await fetch(API + '/rest/v1/rpc/polidex_snapshot', {method:'POST', headers:{apikey:KEY, Authorization:'Bearer ' + KEY, 'Content-Type':'application/json'}, body:'{}'});
        if (!r.ok) throw {code:'http ' + r.status};
        const snap = findSnap(await r.json()); if (!snap) throw {code:'parse'};
        applySnapshot(snap); render();
        setLive('Live from the Polidex database. Updated ' + esc(LIVE.at) + '. ' + LIVE.rolls + ' mapped roll calls, ' + LIVE.members + ' members.', true, 'Refresh');
      } catch (e){ setLive((LIVE ? 'Still showing data from ' + esc(LIVE.at) + '.' : BUILTIN) + ' The live database could not be reached' + (e && e.code ? ' (' + esc(e.code) + ')' : '') + '.', !!LIVE, 'Try again'); }
      return;
    }
    const opts = {cache: fresh ? {staleTime:0, gcTime:86400000, refresh:true} : {staleTime:300000, gcTime:86400000}};
    let res;
    try { res = await MCP.callTool(SERVER, TOOL, QUERY, opts); }
    catch (e){
      if (!(e && e.retryable)) throw e;
      await new Promise(r => setTimeout(r, Math.min(60000, (e.retryAfterMs || 1200) + Math.random() * 800)));
      res = await MCP.callTool(SERVER, TOOL, QUERY, opts);
    }
    const snap = findSnap(res);
    if (!snap){ try { raw = JSON.stringify(res).slice(0, 400); } catch (e) { raw = String(res).slice(0, 400); } throw {code:'parse'}; }
    applySnapshot(snap); render();
    setLive('Live from the Polidex database. Updated ' + esc(LIVE.at) + '. ' + LIVE.rolls + ' mapped roll calls, ' + LIVE.members + ' members.', true, 'Refresh');
  } catch (e){ liveError(e, raw); }
  finally { liveBusy = false; }
}

function currentView(){ const h = (location.hash || '').slice(1); return views[h] ? h : 'overview'; }
function render(){
  const v = currentView();
  document.querySelectorAll('nav.tabs a').forEach(a => { if (a.dataset.tab === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.getElementById('app').innerHTML = views[v]();
}
function onClick(ev){
  const t = ev.target.closest('[data-open],[data-state],button'); if (!t) return;
  if (t.dataset.state){ state.filter = state.filter === t.dataset.state ? 'All' : t.dataset.state; render(); return; }
  const list = quizList(), st = list[state.idx];
  if (t.dataset.open !== undefined){ state.sel = t.dataset.open || null; if (currentView() !== 'profiles'){ location.hash = 'profiles'; } else render(); window.scrollTo(0, 0); return; }
  if (t.id === 'live-retry'){ loadLive(true); return; }
  if (t.dataset.filter){ state.filter = t.dataset.filter; render(); return; }
  if (t.dataset.mode){ state.mode = t.dataset.mode; state.idx = 0; }
  else if (t.dataset.ans !== undefined){ state.ans[st.id] = t.dataset.ans === 'ns' ? 'ns' : Number(t.dataset.ans); if (!state.imp[st.id]) state.imp[st.id] = 2; }
  else if (t.dataset.imp){ state.imp[st.id] = Number(t.dataset.imp); }
  else if (t.dataset.step){ state.idx = Math.max(0, Math.min(list.length - 1, state.idx + Number(t.dataset.step))); }
  else if (t.id === 'reset'){ state.ans = {}; state.imp = {}; state.idx = 0; }
  else return;
  save(); render();
}
if (typeof document !== 'undefined'){
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('g[data-state]')){ ev.preventDefault(); onClick(ev); } });
  document.addEventListener('change', ev => { if (ev.target.id === 'state-select'){ state.filter = ev.target.value; render(); } });
  document.addEventListener('input', ev => { if (ev.target.id === 'q'){ state.q = ev.target.value; const el = document.getElementById('plist'); if (el) el.innerHTML = listHTML(); } });
  window.addEventListener('hashchange', () => { if (currentView() !== 'profiles') state.sel = null; render(); window.scrollTo(0, 0); });
  render();
  loadLive(false);
}
if (typeof module !== 'undefined') module.exports = {ST, PROFILES, axisScores, band, fband, matchScore, profileReadings, findSnap, applySnapshot, fmtBill, state, getLive:() => LIVE};
